            .map(stem);

        var QI = QA.map(function (e) {
          var q = toks(e[0]);
          var a = toks(e[1]);
          return { q: q, qs: new Set(q), as: new Set(a), raw: e[0].toLowerCase() };
        });

        var DF = {};
        QI.forEach(function (e) {
          e.qs.forEach(function (t) {
            DF[t] = (DF[t] || 0) + 1;
          });
        });

        function idf(t) {
          return Math.log((QA.length + 1) / ((DF[t] || 0) + 0.5));
        }

        function nnnFind(text) {
          var t = toks(text);
          var w = text.toLowerCase().trim().split(/\s+/).slice(0, 2).join(' ');
          var best = -1;
          var bs = 0;
          if (!t.length) return null;

          QI.forEach(function (e, i) {
            var s = 0;
            var m = 0;
            var seen = {};
            t.forEach(function (x) {
              if (seen[x]) return;
              seen[x] = 1;
              if (e.qs.has(x)) {
                s += idf(x);
                m++;
              } else if (e.as.has(x)) {
                s += idf(x) * 0.15;
              }
            });
            s = s / Math.sqrt(0.5 + e.q.length * 0.35) * (0.6 + 0.4 * m / Math.max(1, e.q.length));
            if (s > 0 && e.raw.indexOf(w) === 0) s += 1.2;
            if (s > bs) {
              bs = s;
              best = i;
            }
          });

          return bs >= 1.0 ? QA[best][1] : null;
        }
        /*QA-END*/

        var log = $('nnn-log');
        var chips = $('nnn-chips');
        var box = $('nnn-box');
        var btn = $('nnn-btn');
        var tease = $('nnn-tease');
        var started = false;
        var shown = false;

        function pick(a) {
          return a[Math.floor(Math.random() * a.length)];
        }

        function add(t, me, html) {
          var d = document.createElement('div');
          d.className = 'nnn-m' + (me ? ' me' : '');
          if (html) {
            d.innerHTML = t;
          } else {
            d.textContent = t;
          }
          log.appendChild(d);
          log.scrollTop = log.scrollHeight;
          return d;
        }

        function say(t, html) {
          return new Promise(function (resolve) {
            var d = add('…');
            setTimeout(function () {
              d.remove();
              add(t, 0, html);
              resolve();
            }, Math.min(1500, 400 + t.length * 10));
          });
        }

        function setChips(a) {
          chips.innerHTML = '';
          a.forEach(function (c) {
            var b = document.createElement('button');
            b.textContent = c;
            b.type = 'button';
            b.onclick = function () { ask(c); };
            chips.appendChild(b);
          });
        }

        function formLink() {
          return '<a href="' + C.formUrl + '" target="_blank" rel="noopener">Start the form</a>';
        }

        function open() {
          box.style.display = 'flex';
          btn.style.display = 'none';
          tease.style.display = 'none';
          $('nnn-in').focus();

          if (started) return;
          started = true;

          say(pick(['Hey you 👋', 'Hi there!', 'Well hello 😏']))
            .then(function () { return say('I’m here to walk you through this. Honestly, the best first move is the form. It takes about a minute a page, and I’ll be right here if you get stuck.'); })
            .then(function () { return say(formLink(), 1); })
            .then(function () { setChips(['What’s the deadline?', 'How much is the tribute?', 'Is this legit?', 'Pay & send proof', 'Contact Jade']); });
        }

        function code() {
          var k = 'nnn_code';
          var c;
          try {
            c = localStorage.getItem(k);
          } catch (e) {}

          if (!c) {
            var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            var r = new Uint8Array(8);
            crypto.getRandomValues(r);
            c = 'NNN-' + [].map.call(r, function (x) { return A[x % 32]; }).join('');
            try {
              localStorage.setItem(k, c);
            } catch (e) {}
          }
          return c;
        }

        function payFlow() {
          var c = code();
          say('Here’s your personal code: ' + c + '\nPut it in the payment note. Only pay through these official links, and check the name on the payment screen before you send:')
            .then(function () {
              say(LINKS.map(function (l) { return '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>'; }).join('<br>'), 1);
            })
            .then(function () {
              return say('YouPay and Throne often have no note field. That’s fine, your proof gets matched by amount, time and receipt ID. Once you’ve paid, tap “I paid” and send the details.');
            })
            .then(function () { setChips(['I paid', 'What’s the deadline?', 'Contact Jade']); });
        }

        function proofForm() {
          var p = $('nnn-proof');
          p.style.display = 'block';
          p.innerHTML = '<select id="p1">' + LINKS.map(function (l) { return '<option>' + l[0] + '</option>'; }).join('') + '</select><input id="p2" placeholder="Name or @handle you paid from"><input id="p3" placeholder="Amount sent" inputmode="decimal"><small>When you sent it (your local time)</small><input id="p4" type="datetime-local"><input id="p5" placeholder="Transaction / receipt ID (or none)"><small>Screenshot (crop out card numbers)</small><input id="p6" type="file" accept="image/*,.pdf"><button class="nnn-go" id="p7" type="button">Send</button> <button class="nnn-go" id="p8" type="button" style="background:none;color:var(--fg);border:1px solid var(--bd)">Cancel</button><div id="p9" style="color:var(--danger);margin-top:6px"></div>';

          $('p8').onclick = function () { p.style.display = 'none'; };
          $('p7').onclick = function () {
            var e = $('p9');
            var t = new Date($('p4').value).getTime();
            var amt = parseFloat($('p3').value);
            var now = Date.now();

            if (!$('p2').value.trim() || !amt || !$('p4').value) return e.textContent = 'Please fill in the app, who you paid from, amount and time.';
            if (isNaN(t) || t > now + 300000) return e.textContent = 'That time is in the future. Please check it.';
            if (t < OPEN) return e.textContent = 'That’s earlier than this payment window opened. Please check the date.';
            if (now > GRACE) return e.textContent = 'The payment window has closed. Please contact Goddess Jade directly.';

            var tm = t <= DEADLINE ? 'On time' : t <= GRACE ? 'Grace period' : 'Late';
            var d = {
              code: code(),
              app: $('p1').value,
              paidFrom: $('p2').value.trim(),
              amount: amt,
              sentAt: new Date(t).toISOString(),
              receiptId: $('p5').value.trim() || 'none',
              timing: tm,
              hasFile: !!$('p6').files[0]
            };

            p.style.display = 'none';

            var txt = 'NNN PAYMENT\nCode: ' + d.code + '\nApp: ' + d.app + '\nPaid from: ' + d.paidFrom + '\nAmount: $' + d.amount + '\nSent: ' + new Date(t).toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }) + ' PT (' + tm + ')\nReceipt ID: ' + d.receiptId;

            if (C.proofApiUrl) {
              fetch(C.proofApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(d)
              }).then(function () {
                say('Got it, thank you! Goddess Jade will match it against her own payment records. You’ll hear from her once it’s verified. Remember, sending proof doesn’t confirm you by itself.');
              }).catch(function () {
                say('That didn’t go through. Please send these details to Goddess Jade directly:\n\n' + txt + '\n\n' + CONTACT);
              });
            } else {
              try { navigator.clipboard.writeText(txt); } catch (x) {}
              say('Thanks! Last step: send this to Goddess Jade along with your screenshot. I copied it for you:\n\n' + txt + '\n\n' + CONTACT + '\n\nShe checks it against her own payment records, and she’ll share your access link once it’s verified. Sending this doesn’t confirm you by itself.');
            }
          };
        }

        function ask(q) {
          add(q, 1);
          chips.innerHTML = '';
          var l = q.toLowerCase();

          if (/^(i paid|send proof|proof)$/.test(l) || /i (just )?paid/.test(l)) return proofForm();
          if (/my code|pay & send|pay and send|how do i pay|how to pay|payment link|where.*pay/.test(l)) return payFlow();
          if (/start|apply|begin|fill/.test(l) && /form|apply|start|begin/.test(l)) return say('Love that. Here you go:').then(function () { return say(formLink(), 1); });

          var hit = nnnFind(q);
          if (hit) return say(hit).then(function () { setChips(['Start the form', 'What’s the deadline?', 'Contact Jade']); });

          say(pick(['Hmm, that one’s not in what I’ve got.\n\n', 'Good question, but I don’t have a reliable answer for that.\n\n']) + 'I can only explain the published rules, so for anything personal, ask Goddess Jade directly rather than guessing.\n\n' + CONTACT)
            .then(function () { setChips(['Start the form', 'What’s the deadline?']); });
        }

        btn.onclick = open;
        $('nnn-close').onclick = function () {
          box.style.display = 'none';
          btn.style.display = '';
          $('nnn-proof').style.display = 'none';
        };

        $('nnn-form').onsubmit = function (e) {
          e.preventDefault();
          var v = $('nnn-in').value.trim();
          if (v) {
            $('nnn-in').value = '';
            ask(v);
          }
        };

        var T = [
          'Still just looking? 👀 Peek at page one. Nothing is sent until the very end.',
          'Curious what you’d be signing up for? Starting is free and takes about a minute a page.',
          'Psst… people who start usually finish. Want me to walk you through it?'
        ];

        setTimeout(function () {
          if (box.style.display !== 'flex' && !shown) {
            shown = true;
            $('nnn-tt').textContent = pick(T);
            tease.style.display = 'block';
          }
        }, 9000);

        tease.onclick = function (e) {
          if (e.target.id === 'nnn-tx') {
            tease.style.display = 'none';
          } else {
            open();
          }
        };
      })();
    </script>
  </body>
</html>
